<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferro App · MVP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230F2A4A'/%3E%3Cg fill='%23EDF1F5'%3E%3Cpolygon points='12,13 44,13 49,24 12,24'/%3E%3Cpolygon points='12,28 34,28 39,39 12,39'/%3E%3Cpolygon points='12,43 21,43 26,54 12,54'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--prussian:#0F2A4A;--cyan:#1F4FA3;--oxide:#B4492C;--steel:#8C96A3;--signal:#1E8F5A;
--bg:#EDF1F5;--fg:#0A1626;--muted:#3B4A5E;--card:#FFFFFF;--line:rgba(15,42,74,.14);--field:#F7F9FB;
--f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color-scheme:light;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--fg:#E6ECF3;--muted:#A9B6C6;--card:#11243D;--line:rgba(237,241,245,.12);--field:#0E2036;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A2E;--fg:#E6ECF3;--muted:#A9B6C6;--card:#11243D;--line:rgba(237,241,245,.12);--field:#0E2036;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--oxide);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--prussian);color:#EDF1F5;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-stretch:125%;font-weight:900;font-size:22px;letter-spacing:-.04em}
.brand span{font-size:12px;color:var(--steel);margin-left:auto}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C9D3E0;font:500 15px var(--f);padding:10px;border-radius:4px;cursor:pointer}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.11);color:#fff}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--steel)}
.side-foot select{width:100%;font:13px var(--f);padding:7px;border-radius:3px;background:#173659;color:#fff;border:1px solid rgba(255,255,255,.15)}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.view{display:none}.view.on{display:block}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-stretch:125%;font-weight:800;font-size:clamp(26px,3.2vw,38px);letter-spacing:-.03em;line-height:1.05;margin:0}
.head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
h2{font-stretch:115%;font-weight:700;font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--f);padding:9px 14px;border-radius:3px;border:1.5px solid var(--cyan);background:var(--cyan);color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cyan)}
.btn.warn{background:var(--oxide);border-color:var(--oxide)}
.btn:hover{filter:brightness(1.1)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px}
.form{display:grid;gap:12px}
.form .grp{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.form .grp:first-child{border-top:0;margin-top:0;padding-top:0}
.fld{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:10px}
.fld label{font-size:14px}
.fld input,.fld select,.inp{font:14px var(--f);padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--field);color:var(--fg);width:100%;font-variant-numeric:tabular-nums;text-align:right}
.inp{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:3px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-stretch:110%;font-weight:800;font-size:clamp(19px,1.9vw,26px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .s{font-size:12px;margin-top:2px}
.good{color:var(--signal)}.bad{color:var(--oxide)}.mid{color:#B7861F}
.chart{width:100%;height:240px;display:block}
.tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-weight:700;z-index:1}
td:first-child,th:first-child{text-align:left}
.sens td{text-align:center;font-weight:600;padding:7px 6px}.sens th{white-space:normal;font-size:12.5px}
.sens th{text-align:center}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.tranches{display:grid;gap:8px;margin-top:6px}
.tr{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;font-size:13.5px}
.tr .bar{height:18px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,0 100%)}
textarea{width:100%;min-height:420px;font:14px/1.6 var(--f);padding:16px;border:1px solid var(--line);border-radius:3px;background:var(--field);color:var(--fg);resize:vertical}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:12px;background:rgba(31,79,163,.12);color:var(--cyan);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--prussian);color:#fff;padding:10px 16px;border-radius:3px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.bars div{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bars span.b{height:12px;background:var(--cyan)}
select.st{font:13px var(--f);padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--field);color:var(--fg)}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:#0F2A4A;color:#EDF1F5;background-image:linear-gradient(rgba(237,241,245,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(237,241,245,.06) 1px,transparent 1px);background-size:48px 48px}
.gate[hidden],[hidden]{display:none!important}
.gate .box{max-width:520px;display:grid;gap:18px}
.gate h1{color:#fff;font-size:clamp(30px,5vw,48px)}
.gate p{color:#C9D3E0;margin:0;font-size:17px}
.gate .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gate .btn.light{background:#EDF1F5;color:#0F2A4A;border-color:#EDF1F5}
.gate .btn.out{background:transparent;color:#EDF1F5;border-color:rgba(237,241,245,.5)}
.gate a{color:#C9D3E0}
.gate select{font:14px var(--f);padding:7px;border-radius:3px;background:#173659;color:#fff;border:1px solid rgba(255,255,255,.2)}
.upsell{border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:12px;display:grid;gap:8px;color:#C9D3E0;font-size:12.5px}
.upsell b{color:#fff;font-size:14px}
.upsell .btn{justify-content:center;background:#B4492C;border-color:#B4492C;padding:8px 10px;font-size:13px}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#C9D3E0;word-break:break-all}
.who button{background:none;border:1px solid rgba(255,255,255,.2);color:#C9D3E0;border-radius:3px;padding:4px 8px;font:12px var(--f);cursor:pointer;white-space:nowrap}
.side-foot a{color:#C9D3E0;font-size:12.5px}
.demo-bar{background:#F9EEDA;color:#6B4A0F;font-size:13px;padding:8px 14px;border-radius:3px;margin-bottom:16px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.buyrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn.buy{background:#B4492C;border-color:#B4492C}
@media (max-width:1100px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:780px){.app{grid-template-columns:1fr}aside{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:20;gap:2px}
.brand{padding:4px 10px 4px 4px}.brand span,.side-foot{display:none}.navbtn{white-space:nowrap;width:auto}.grid2{grid-template-columns:1fr}.fld{grid-template-columns:1fr 110px}}
@media print{aside,.tools,.no-print{display:none!important}.app{display:block}.view{display:none!important}.view.on{display:block!important}textarea{border:0;min-height:auto}}
</style>

<script src="assets/config.js"></script>
<script src="assets/ferro.js"></script>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="box">
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><g fill="#EDF1F5"><polygon points="8,8 50,8 56,20 8,20"/><polygon points="8,26 36,26 42,38 8,38"/><polygon points="8,44 18,44 24,56 8,56" fill="#B4492C"/></g></svg>
    <h1 data-i="gate_h"></h1>
    <p data-i="gate_p"></p>
    <div class="row"><button class="btn light" type="button" id="gate_signup" data-i="gate_signup"></button><button class="btn out" type="button" id="gate_login" data-i="gate_login"></button></div>
    <div class="row"><a href="index.html" id="gate_back" data-i="back_web"></a><select id="gate_lang" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option></select></div>
  </div>
</div>
<div class="app" id="appwrap">
<aside>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><g fill="#EDF1F5"><polygon points="8,8 50,8 56,20 8,20"/><polygon points="8,26 36,26 42,38 8,38"/><polygon points="8,44 18,44 24,56 8,56"/></g></svg><b>ferro</b><span>MVP</span></div>
  <button class="navbtn" data-v="raas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="6" y="8" width="12" height="10"/><path d="M12 8V4M9 12h.01M15 12h.01M9 18v2M15 18v2"/></svg><span data-i="n_raas"></span></button>
  <button class="navbtn" data-v="gpu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="5" y="5" width="14" height="14"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg><span data-i="n_gpu"></span></button>
  <button class="navbtn" data-v="dc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="3" width="16" height="6"/><rect x="4" y="11" width="16" height="6"/><path d="M8 6h.01M8 14h.01M12 21l2-4h-4l2-4"/></svg><span data-i="n_dc"></span></button>
  <button class="navbtn" data-v="memo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg><span data-i="n_memo"></span></button>
  <button class="navbtn" data-v="index"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 17l5-6 4 3 5-7 4 4M3 21h18"/></svg><span data-i="n_index"></span></button>
  <button class="navbtn" data-v="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg><span data-i="n_leads"></span></button>
  <button class="navbtn" data-v="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-i="n_account"></span></button>
  <button class="navbtn" data-v="admin" id="nav_admin" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span data-i="n_admin"></span></button>
  <div class="side-foot">
    <div class="upsell"><b data-i="up_t"></b><span data-i="up_p"></span><a class="btn" data-buy="kit" data-medium="app_sidebar" href="#" data-i="up_b"></a></div>
    <div class="who" id="who" hidden><span id="who_email"></span><button type="button" id="logout" data-i="logout"></button></div>
    <a href="index.html" id="back_web" data-i="back_web"></a>
    <select id="lang" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option></select>
    <span data-i="disc"></span>
  </div>
</aside>

<main>
<!-- MODEL VIEWS share a template rendered by JS -->
<section class="view" id="v-raas"></section>
<section class="view" id="v-gpu"></section>
<section class="view" id="v-dc"></section>

<section class="view" id="v-memo">
  <div class="head"><div><h1 data-i="memo_t"></h1><p data-i="memo_p"></p></div>
    <div class="tools"><select class="inp" id="memo_src" style="width:auto"></select><button class="btn ghost" id="memo_gen" data-i="regen"></button><button class="btn ghost" id="memo_copy" data-i="copy"></button><button class="btn" onclick="window.print()" data-i="pdf"></button><a class="btn buy" data-buy="review" data-medium="app_memo" href="#" data-i="memo_review"></a></div></div>
  <div class="grid2">
    <div class="card"><h2 data-i="memo_struct"></h2><div class="tranches" id="memo_tr"></div><div class="form" style="margin-top:16px">
      <div class="fld"><label data-i="t_sen"></label><input type="number" id="t_sen" value="70" min="0" max="100"></div>
      <div class="fld"><label data-i="t_mez"></label><input type="number" id="t_mez" value="20" min="0" max="100"></div>
      <div class="fld"><label data-i="t_company"></label><input class="inp" id="t_company" value="Acme Robotics"></div>
    </div><p class="note" data-i="t_note"></p></div>
    <div class="card"><textarea id="memo_txt" aria-label="Memo"></textarea></div>
  </div>
</section>

<section class="view" id="v-index">
  <div class="head"><div><h1 data-i="idx_t"></h1><p data-i="idx_p"></p></div>
    <div class="tools"><label class="btn ghost" style="cursor:pointer"><span data-i="import"></span><input type="file" id="idx_file" accept=".csv" hidden></label><button class="btn ghost" id="idx_sample" data-i="sample"></button><button class="btn" id="idx_export" data-i="export"></button></div></div>
  <div class="kpis" id="idx_kpis"></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 data-i="idx_chart"></h2><select class="inp" id="idx_gpu" style="width:auto"></select></div><svg class="chart" id="idx_svg" role="img" aria-label="Chart"></svg><p class="note" id="idx_note"></p></div>
  <div class="card" style="margin-top:16px"><h2 data-i="idx_table"></h2><div class="tablewrap"><table id="idx_tbl"></table></div></div>
</section>

<section class="view" id="v-leads">
  <div class="head"><div><h1 data-i="leads_t"></h1><p data-i="leads_p"></p></div>
    <div class="tools"><label class="btn ghost" style="cursor:pointer"><span data-i="import"></span><input type="file" id="ld_file" accept=".csv" multiple hidden></label><button class="btn ghost" id="ld_clear" data-i="clear"></button><button class="btn" id="ld_export" data-i="export"></button></div></div>
  <div class="kpis" id="ld_kpis"></div>
  <div class="grid2" style="margin-bottom:16px"><div class="card"><h2 data-i="by_country"></h2><div class="bars" id="ld_bars"></div></div>
  <div class="card"><h2 data-i="filters"></h2><div class="form">
    <div class="fld"><label data-i="search"></label><input class="inp" id="ld_q"></div>
    <div class="fld"><label data-i="country"></label><select id="ld_country"></select></div>
    <div class="fld"><label data-i="status"></label><select id="ld_status"></select></div>
    <div class="fld"><label data-i="segment"></label><select id="ld_seg"></select></div></div></div></div>
  <div class="card"><div class="tablewrap"><table id="ld_tbl"></table></div><p class="note" id="ld_page"></p></div>
</section>
<section class="view" id="v-account">

  <div class="acc-grid">
    <div class="card"><h2 data-i="acc_profile"></h2>
      <form class="form" id="profile_form" onsubmit="return false">

    </div>
  </div>
</section>

<section class="view" id="v-admin">
  <div class="head"><div><h1 data-i="adm_t"></h1><p data-i="adm_p"></p></div><div class="tools"><button class="btn ghost" id="adm_reload" data-i="adm_reload"></button></div></div>
  <div class="kpis" id="adm_kpis"></div>

/* ================= finance engine ================= */
function pmt(r,n,pv){return r===0?pv/n:pv*r/(1-Math.pow(1+r,-n))}
function irr(cfs){let lo=-0.99,hi=1;const npv=r=>cfs.reduce((s,c,i)=>s+c/Math.pow(1+r,i),0);
  if(npv(lo)*npv(hi)>0)return null;for(let i=0;i<200;i++){const m=(lo+hi)/2;(npv(lo)*npv(m)<=0)?hi=m:lo=m}return (lo+hi)/2}
function engine({capex,revM,opexM,down,apr,term,horizon,resid,disc}){
  const loan=capex*(1-down/100),eq=capex*down/100,r=apr/1200,pay=loan>0?pmt(r,term,loan):0;
  const rows=[];let cum=-eq;const cfs=[-eq];let dsum=0,dn=0;
  for(let m=1;m<=horizon;m++){
    const debt=m<=term?pay:0;const noi=revM-opexM;let cf=noi-debt;
    if(m===horizon){
      // balloon: remaining loan balance repaid from residual
      let bal=0;if(m<term){bal=loan*Math.pow(1+r,m)-pay*((Math.pow(1+r,m)-1)/(r||1e-12));if(r===0)bal=loan-pay*m}
      cf+=capex*resid/100-Math.max(bal,0);
    }
    cum+=cf;cfs.push(cf);if(debt>0){dsum+=noi/debt;dn++}
    rows.push({m,rev:revM,opex:opexM,debt,cf,cum,dscr:debt>0?noi/debt:null});
  }
  const mi=irr(cfs);const irrA=mi==null?null:Math.pow(1+mi,12)-1;
  const dr=disc/1200;const npv=cfs.reduce((s,c,i)=>s+c/Math.pow(1+dr,i),0);
  const noi=revM-opexM;
  return {rows,loan,eq,pay,dscr:dn?dsum/dn:null,irr:irrA,npv,payback:noi>0?capex/noi:null,noi};
}

const MODELS={
 raas:{title:'raas_t',desc:'raas_p',
  groups:[['g_asset',[['units',10,1],['price_unit',180000,1000],['maint',6,.5]]],['g_rev',[['fee',9500,100],['util',75,1]]],['g_cost',[['opex_unit',1200,50]]],['g_fin',[['down',30,1],['apr',11,.25],['term',48,1]]],['g_exit',[['horizon',48,1],['resid',25,1],['disc_rate',12,.5]]]],
  map:v=>({capex:v.units*v.price_unit,revM:v.units*v.fee*v.util/100,opexM:v.units*v.opex_unit+v.units*v.price_unit*v.maint/1200,down:v.down,apr:v.apr,term:v.term,horizon:v.horizon,resid:v.resid,disc:v.disc_rate}),
  priceKey:'fee',utilKey:'util',beLabel:v=>{const per=(v.price_unit*(1-v.down/100)); const p=pmt(v.apr/1200,v.term,per);return Math.ceil(((p+v.opex_unit+v.price_unit*v.maint/1200)/v.fee)*100)+'% '+t('util').toLowerCase().replace(' (%)','')}},
 gpu:{title:'gpu_t',desc:'gpu_p',
  groups:[['g_asset',[['gpus',64,8],['gpu_cost',32000,500]]],['g_rev',[['rate',2.2,.05],['util',75,1]]],['g_cost',[['kw',1.1,.05],['kwh',0.09,.005],['pue',1.35,.05],['other',180,10]]],['g_fin',[['down',30,1],['apr',13,.25],['term',36,1]]],['g_exit',[['horizon',48,1],['resid',15,1],['disc_rate',14,.5]]]],
  map:v=>{const h=730;return {capex:v.gpus*v.gpu_cost,revM:v.gpus*v.rate*h*v.util/100,opexM:v.gpus*(v.kw*v.pue*h*v.kwh*(0.4+0.6*v.util/100)+v.other),down:v.down,apr:v.apr,term:v.term,horizon:v.horizon,resid:v.resid,disc:v.disc_rate}},
  priceKey:'rate',utilKey:'util',beLabel:v=>{const h=730,loan=v.gpu_cost*(1-v.down/100),p=pmt(v.apr/1200,v.term,loan);const cost=p+v.kw*v.pue*h*v.kwh*(0.4+0.6*v.util/100)+v.other;return money(cost/(h*v.util/100),2)+' /GPU-h'}},
 dc:{title:'dc_t',desc:'dc_p',
  groups:[['g_asset',[['mw',2,.5],['capex_mw',9500000,100000]]],['g_rev',[['rent',165,5],['occ',85,1]]],['g_cost',[['opex_pct',35,1]]],['g_fin',[['down',35,1],['apr',9.5,.25],['term',120,12]]],['g_exit',[['horizon',120,12],['resid',60,1],['disc_rate',10,.5]]]],
  map:v=>{const rev=v.mw*1000*v.rent*v.occ/100;return {capex:v.mw*v.capex_mw,revM:rev,opexM:rev*v.opex_pct/100,down:v.down,apr:v.apr,term:v.term,horizon:v.horizon,resid:v.resid,disc:v.disc_rate}},
  priceKey:'rent',utilKey:'occ',beLabel:v=>{const loan=v.mw*v.capex_mw*(1-v.down/100),p=pmt(v.apr/1200,v.term,loan);return Math.ceil(p/(v.mw*1000*v.rent*(1-v.opex_pct/100))*100)+'% '+t('occ').toLowerCase().replace(' (%)','')}}
};
const STATE={};for(const k in MODELS){const base={};MODELS[k].groups.forEach(g=>g[1].forEach(f=>base[f[0]]=f[1]));MODELS[k].base=base;STATE[k]=Object.assign({},base,store.get('model_'+k,{}))}

function dscrClass(d){return d==null?'':d>=1.25?'good':d>=1?'mid':'bad'}

   <div class="cols"><div class="card"><form class="form" onsubmit="return false">${M.groups.map(g=>`<div class="grp">${t(g[0])}</div>`+g[1].map(f=>`<div class="fld"><label for="${k}_${f[0]}">${t(f[0])}</label><input type="number" id="${k}_${f[0]}" data-k="${f[0]}" step="${f[2]}" value="${v[f[0]]}"></div>`).join('')).join('')}</form></div>

   <div class="card"><h2>${t('tbl_t')}</h2><div class="tablewrap" style="max-height:330px"><table id="${k}_tbl"></table></div></div></div></div></div>`;
  el.querySelectorAll('input[data-k]').forEach(i=>i.addEventListener('input',()=>{const x=parseFloat(i.value);if(!isNaN(x)){v[i.dataset.k]=x;compute(k)}}));
  el.querySelector('[data-act=reset]').onclick=()=>{STATE[k]=Object.assign({},M.base);store.set('model_'+k,{});renderModel(k)};
  el.querySelector('[data-act=save]').onclick=()=>{store.set('model_'+k,v);cloudSave(k,v).then(ok=>toast(ok?t('saved_cloud'):t('saved')))};
  el.querySelector('[data-act=csv]').onclick=()=>{const r=engine(M.map(v));download(`ferro-${k}.csv`,['month,revenue,opex,debt_service,equity_cf,cumulative,dscr',...r.rows.map(x=>[x.m,x.rev.toFixed(2),x.opex.toFixed(2),x.debt.toFixed(2),x.cf.toFixed(2),x.cum.toFixed(2),x.dscr==null?'':x.dscr.toFixed(3)].join(','))].join('\n'))};
  compute(k);
}
function compute(k){
  const M=MODELS[k],v=STATE[k],r=engine(M.map(v)),inp=M.map(v);
  const pb=r.payback;
  document.getElementById(k+'_kpis').innerHTML=[
   [t('k_dscr'),r.dscr==null?'—':num(r.dscr)+'×',t('k_dscr_s'),dscrClass(r.dscr)],
   [t('k_irr'),r.irr==null?'—':num(r.irr*100,1)+'%','',r.irr==null?'bad':r.irr>0.15?'good':r.irr>0?'mid':'bad'],
   [t('k_payback'),pb?num(pb,1)+' '+t('months'):t('never'),'',pb&&pb<=v.horizon?'good':'bad'],
   [t('k_npv'),money(r.npv),'',r.npv>0?'good':'bad'],
   [t('k_capex'),money(inp.capex),'',''],[t('k_loan'),money(r.loan),money(r.pay)+' /'+t('m').toLowerCase(),''],
   [t('k_rev'),money(inp.revM),'',''],[t('k_be'),M.beLabel(v),'','']
  ].map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v ${x[3]}">${x[1]}</div>${x[2]?`<div class="s" style="color:var(--muted)">${x[2]}</div>`:''}</div>`).join('');
  // chart
  drawLine(document.getElementById(k+'_chart'),[{pts:r.rows.map(x=>[x.m,x.cum]),color:'#1F4FA3'}],{zero:true,fmtY:y=>moneyK(y)});
  // table
  document.getElementById(k+'_tbl').innerHTML=`<tr><th>${t('m')}</th><th>${t('rev')}</th><th>${t('opex')}</th><th>${t('debt')}</th><th>${t('cf')}</th><th>${t('cum')}</th><th>${t('dscr')}</th></tr>`+
   r.rows.map(x=>`<tr><td>${x.m}</td><td>${money(x.rev)}</td><td>${money(x.opex)}</td><td>${money(x.debt)}</td><td class="${x.cf<0?'bad':''}">${money(x.cf)}</td><td class="${x.cum<0?'bad':'good'}">${money(x.cum)}</td><td class="${dscrClass(x.dscr)}">${x.dscr==null?'—':num(x.dscr)}</td></tr>`).join('');
  // sensitivity
  const utils=[40,55,70,85,100],mults=[.7,.85,1,1.15,1.3];
  document.getElementById(k+'_sens').innerHTML=`<tr><th>${t('sens_rows')} ↓ · ${t('sens_cols')} →</th>${mults.map(m=>`<th>${Math.round(m*100)}%</th>`).join('')}</tr>`+
   utils.map(u=>`<tr><th>${u}%</th>${mults.map(m=>{const vv=Object.assign({},v,{[M.utilKey]:u,[M.priceKey]:v[M.priceKey]*m});const d=engine(M.map(vv)).dscr;const c=d==null?'':d>=1.25?'rgba(30,143,90,.22)':d>=1?'rgba(183,134,31,.22)':'rgba(180,73,44,.22)';return `<td style="background:${c}">${d==null?'—':num(d)}</td>`}).join('')}</tr>`).join('');
  if(currentView==='memo')genMemo();
}

/* ================= SVG line chart ================= */
function drawLine(svg,series,opt={}){
  const W=svg.clientWidth||700,H=svg.clientHeight||240,P={l:100,r:14,t:12,b:26};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const all=series.flatMap(s=>s.pts);if(!all.length){svg.innerHTML='';return}
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  if(opt.zero){y0=Math.min(y0,0);y1=Math.max(y1,0)}if(y0===y1){y1+=1}if(x0===x1)x1+=1;
  const pad=(y1-y0)*.08;y0-=pad;y1+=pad;
  const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
  const css=getComputedStyle(document.documentElement);const mut=css.getPropertyValue('--muted'),ln=css.getPropertyValue('--line');
  let g='';for(let i=0;i<=4;i++){const yy=y0+(y1-y0)*i/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(yy)}" y2="${Y(yy)}" stroke="${ln}"/><text x="${P.l-8}" y="${Y(yy)+4}" text-anchor="end" font-size="11" fill="${mut}">${(opt.fmtY||(v=>v.toFixed(2)))(yy)}</text>`}
  const xt=opt.xLabels||null;
  if(xt){xt.forEach((lab,i)=>{if(i%Math.ceil(xt.length/6)===0)g+=`<text x="${X(i)}" y="${H-6}" font-size="11" text-anchor="middle" fill="${mut}">${lab}</text>`})}
  else{for(let i=0;i<=5;i++){const xx=Math.round(x0+(x1-x0)*i/5);g+=`<text x="${X(xx)}" y="${H-6}" font-size="11" text-anchor="middle" fill="${mut}">${xx}</text>`}}
  if(opt.zero&&y0<0&&y1>0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#B4492C" stroke-dasharray="4 3"/>`;
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;const l=s.pts[s.pts.length-1];g+=`<circle cx="${X(l[0])}" cy="${Y(l[1])}" r="3.5" fill="#B4492C"/>`});
  svg.innerHTML=g;
}

const MEMO={
es:(c,k,M,v,r,inp,s,mz,j)=>`DEAL MEMO · ${c}\nPreparado con Ferro · ${new Date().toLocaleDateString('es-ES')}\nDocumento de trabajo. No es una oferta de financiamiento ni asesoría de inversión.\n\n1. RESUMEN\n${c} busca ${money(r.loan)} de deuda para financiar ${t(M.title)} con una inversión total de ${money(inp.capex)}. El activo genera ${money(inp.revM)} al mes y deja un ingreso operativo neto de ${money(r.noi)} mensuales.\n\n2. ESTRUCTURA PROPUESTA (ILUSTRATIVA)\n• Senior ${s}%: ${money(inp.capex*s/100)}\n• Mezzanine ${mz}%: ${money(inp.capex*mz/100)}\n• Junior / equity ${j}%: ${money(inp.capex*j/100)}\nPréstamo modelado: ${num(v.apr,2)}% anual a ${v.term} meses, cuota de ${money(r.pay)}.\n\n3. MÉTRICAS CLAVE\n• DSCR promedio: ${r.dscr==null?'—':num(r.dscr)+'×'} (referencia de mercado ≥ 1,25×)\n• TIR del equity: ${r.irr==null?'—':num(r.irr*100,1)+'%'}\n• Payback sin deuda: ${r.payback?num(r.payback,1)+' meses':'no se paga'}\n• Valor residual supuesto: ${v.resid}% del costo al mes ${v.horizon}\n\n4. RIESGOS PRINCIPALES\n• Utilización: es la variable que más mueve el DSCR. Ver tabla de sensibilidad.\n• Precio: una caída del 15–30% en la tarifa reduce la cobertura de la deuda.\n• Valor residual: depende de la obsolescencia tecnológica del activo.\n• Contraparte: concentración de clientes y plazo de los contratos.\n\n5. MITIGANTES SUGERIDOS\n• Contratos de plazo igual o mayor al préstamo.\n• Reserva de liquidez equivalente a 3–6 cuotas.\n• Cláusulas de recompra o remarketing del activo con el fabricante.\n\n6. PRÓXIMOS PASOS\nValidar supuestos con datos reales de operación (12 meses si existen), contratos firmados y cotizaciones del fabricante.`,
en:(c,k,M,v,r,inp,s,mz,j)=>`DEAL MEMO · ${c}\nPrepared with Ferro · ${new Date().toLocaleDateString('en-US')}\nWorking document. Not a financing offer or investment advice.\n\n1. SUMMARY\n${c} seeks ${money(r.loan)} of debt to finance ${t(M.title)} with total investment of ${money(inp.capex)}. The asset generates ${money(inp.revM)} per month and net operating income of ${money(r.noi)} per month.\n\n2. PROPOSED STRUCTURE (ILLUSTRATIVE)\n• Senior ${s}%: ${money(inp.capex*s/100)}\n• Mezzanine ${mz}%: ${money(inp.capex*mz/100)}\n• Junior / equity ${j}%: ${money(inp.capex*j/100)}\nModeled loan: ${num(v.apr,2)}% annual over ${v.term} months, payment ${money(r.pay)}.\n\n3. KEY METRICS\n• Average DSCR: ${r.dscr==null?'—':num(r.dscr)+'×'} (market reference ≥ 1.25×)\n• Equity IRR: ${r.irr==null?'—':num(r.irr*100,1)+'%'}\n• Unlevered payback: ${r.payback?num(r.payback,1)+' months':'never'}\n• Assumed residual value: ${v.resid}% of cost at month ${v.horizon}\n\n4. KEY RISKS\n• Utilization: the variable that moves DSCR most. See sensitivity table.\n• Price: a 15–30% drop in rates reduces debt coverage.\n• Residual value: depends on technological obsolescence.\n• Counterparty: customer concentration and contract length.\n\n5. SUGGESTED MITIGANTS\n• Contracts at least as long as the loan.\n• Liquidity reserve of 3–6 payments.\n• Buy-back or remarketing agreement with the manufacturer.\n\n6. NEXT STEPS\nValidate assumptions with real operating data (12 months if available), signed contracts and manufacturer quotes.`,

fr:(c,k,M,v,r,inp,s,mz,j)=>`MÉMO DE DOSSIER · ${c}\nPréparé avec Ferro · ${new Date().toLocaleDateString('fr-FR')}\nDocument de travail. Ni offre de financement ni conseil en investissement.\n\n1. RÉSUMÉ\n${c} recherche ${money(r.loan)} de dette pour financer ${t(M.title)} pour un investissement total de ${money(inp.capex)}. L’actif génère ${money(inp.revM)} par mois et un résultat d’exploitation net de ${money(r.noi)} par mois.\n\n2. STRUCTURE PROPOSÉE (ILLUSTRATIVE)\n• Senior ${s} % : ${money(inp.capex*s/100)}\n• Mezzanine ${mz} % : ${money(inp.capex*mz/100)}\n• Junior / fonds propres ${j} % : ${money(inp.capex*j/100)}\nPrêt modélisé : ${num(v.apr,2)} % par an sur ${v.term} mois, échéance de ${money(r.pay)}.\n\n3. INDICATEURS CLÉS\n• DSCR moyen : ${r.dscr==null?'—':num(r.dscr)+'×'} (référence de marché ≥ 1,25×)\n• TRI des fonds propres : ${r.irr==null?'—':num(r.irr*100,1)+' %'}\n• Retour sans dette : ${r.payback?num(r.payback,1)+' mois':'jamais'}\n• Valeur résiduelle supposée : ${v.resid} % du coût au mois ${v.horizon}\n\n4. RISQUES PRINCIPAUX\n• Utilisation : la variable qui fait le plus bouger le DSCR. Voir la table de sensibilité.\n• Prix : une baisse de 15 à 30 % du tarif réduit la couverture de la dette.\n• Valeur résiduelle : dépend de l’obsolescence technologique.\n• Contrepartie : concentration des clients et durée des contrats.\n\n5. ATTÉNUATIONS SUGGÉRÉES\n• Contrats d’une durée au moins égale au prêt.\n• Réserve de liquidité de 3 à 6 échéances.\n• Accord de rachat ou de revente avec le fabricant.\n\n6. PROCHAINES ÉTAPES\nValider les hypothèses avec des données d’exploitation réelles (12 mois si disponibles), des contrats signés et des devis du fabricant.`
};

/* ================= CSV parsing ================= */
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
}
const toCSV=(cols,rows)=>[cols.join(','),...rows.map(r=>cols.map(c=>{const s=String(r[c]??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(','))].join('\n');

/* ================= GPU index ================= */
let IDX=store.get('index',null);
function sampleIndex(){
  // Deterministic synthetic data, labeled as SAMPLE in the UI.
  const gpus={'H100 SXM':2.6,'H200':3.4,'A100 80GB':1.35,'L40S':0.95,'B200':5.2},provs=['Provider A','Provider B','Provider C','Provider D','Provider E'];
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const out=[];const today=new Date();
  for(let w=12;w>=0;w--){const d=new Date(today);d.setDate(d.getDate()-w*7);const ds=d.toISOString().slice(0,10);
    for(const g in gpus){const trend=1-(12-w)*0.012;provs.forEach(p=>{out.push({date:ds,gpu:g,provider:p,price_usd_hr:(gpus[g]*trend*(0.82+rnd()*0.36)).toFixed(2),source_url:'sample'})})}}
  return {sample:true,rows:out};
}
function median(a){const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length?s.length%2?s[m]:(s[m-1]+s[m])/2:NaN}
function weekKey(ds){const d=new Date(ds+'T00:00:00');if(isNaN(d))return ds;const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function renderIndex(){
  if(!IDX)IDX=sampleIndex();
  const rows=IDX.rows.filter(r=>r.gpu&&!isNaN(parseFloat(r.price_usd_hr)));
  const gpus=[...new Set(rows.map(r=>r.gpu))].sort();
  const sel=document.getElementById('idx_gpu');const cur=sel.value||gpus[0];
  sel.innerHTML=gpus.map(g=>`<option ${g===cur?'selected':''}>${esc(g)}</option>`).join('');
  const byG={};rows.forEach(r=>{const w=weekKey(r.date);((byG[r.gpu]??={})[w]??=[]).push(parseFloat(r.price_usd_hr))});
  const series=g=>Object.keys(byG[g]||{}).sort().map(w=>[w,median(byG[g][w])]);
  document.getElementById('idx_kpis').innerHTML=gpus.slice(0,4).map(g=>{const s=series(g),last=s.at(-1)?.[1],prev=s.at(-5)?.[1]??s[0]?.[1];const ch=prev?(last/prev-1)*100:0;
    return `<div class="kpi"><div class="l">${esc(g)} · ${t('last')}</div><div class="v">${money(last,2)}</div><div class="s ${ch>=0?'good':'bad'}">${ch>=0?'+':''}${num(ch,1)}% · ${t('chg')}</div></div>`}).join('');
  const s=series(sel.value);
  drawLine(document.getElementById('idx_svg'),[{pts:s.map((p,i)=>[i,p[1]]),color:'#1F4FA3'}],{xLabels:s.map(p=>p[0].slice(5)),fmtY:y=>'$'+y.toFixed(2)});
  const n=document.getElementById('idx_note');n.textContent=(IDX.sample?t('sample_note'):t('real_note'))+` · ${t('obs')}: ${rows.length} · ${t('provs')}: ${new Set(rows.map(r=>r.provider)).size}`;n.className='note '+(IDX.sample?'bad':'');
  const last=[...rows].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,200);
  document.getElementById('idx_tbl').innerHTML=`<tr><th>${t('date')}</th><th>${t('gpu')}</th><th>${t('provider')}</th><th>${t('price')}</th><th>${t('source')}</th></tr>`+last.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.gpu)}</td><td>${esc(r.provider)}</td><td>${money(+r.price_usd_hr,2)}</td><td>${/^https?:/.test(r.source_url)?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">link</a>`:esc(r.source_url)}</td></tr>`).join('');
}
document.getElementById('idx_gpu').addEventListener('change',renderIndex);
document.getElementById('idx_sample').onclick=()=>{IDX=sampleIndex();store.set('index',null);renderIndex()};
document.getElementById('idx_file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text());IDX={sample:false,rows};store.set('index',IDX);renderIndex();e.target.value=''};
document.getElementById('idx_export').onclick=()=>download('ferro-index.csv',toCSV(['date','gpu','provider','price_usd_hr','source_url'],IDX.rows));

  k.innerHTML=[[t('adm_contacts'),ADM.c.length],[t('adm_subs'),ADM.s.length],[t('adm_users'),ADM.u.length]].map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');
  const tbl=(id,rows)=>{const el=document.getElementById(id);if(!rows.length){el.innerHTML='<tr><td class="empty">—</td></tr>';return}const cols=Object.keys(rows[0]);
    el.innerHTML=`<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+rows.map(r=>`<tr>${cols.map(c=>`<td style="white-space:${c==='message'?'normal':'nowrap'};max-width:${c==='message'?'420px':'none'}">${esc(c==='created_at'?String(r[c]).slice(0,16).replace('T',' '):r[c])}</td>`).join('')}</tr>`).join('')};
  tbl('adm_tc',ADM.c);tbl('adm_ts',ADM.s);tbl('adm_tu',ADM.u);
}
document.getElementById('adm_reload').onclick=renderAdmin;
const expA=(rows,name)=>{if(rows.length)download(name,toCSV(Object.keys(rows[0]),rows))};
document.getElementById('adm_exp_c').onclick=()=>expA(ADM.c,'ferro-contactos.csv');
document.getElementById('adm_exp_s').onclick=()=>expA(ADM.s,'ferro-suscriptores.csv');
document.getElementById('adm_exp_u').onclick=()=>expA(ADM.u,'ferro-usuarios.csv');

function applyUser(u){
  const wasNull=!USER;USER=u||null;
  const needLogin=FX&&FX.configured&&CFG.requireLogin!==false;
  document.getElementById('gate').hidden=!(needLogin&&!USER);
  document.getElementById('appwrap').style.visibility=(needLogin&&!USER)?'hidden':'visible';
  document.getElementById('who').hidden=!USER;document.getElementById('who_email').textContent=USER?USER.email:'';
  document.getElementById('nav_admin').hidden=!(USER&&FX&&FX.isAdmin(USER));
  const cfgd=!!(FX&&FX.configured);
  // Sin cuentas: "Mi cuenta" no se muestra. El CRM de prospectos (scraper) solo lo ve un administrador
  // (sin cuentas, solo entrando por la dirección app.html#leads).
  document.querySelector('.navbtn[data-v="account"]').hidden=!cfgd;
  const canLeads=cfgd&&USER&&FX.isAdmin(USER);
  document.querySelector('.navbtn[data-v="leads"]').hidden=!canLeads;
  if(cfgd&&!canLeads&&(currentView==='leads'||currentView==='admin'||(currentView==='account'&&!USER)))show('raas');
  if(!cfgd&&(currentView==='admin'||currentView==='account'))show('raas');
  if(USER&&wasNull)cloudLoad();
  if(currentView==='account')renderAccount();
}
document.getElementById('gate_signup').onclick=()=>FX&&FX.openAuth('signup');
document.getElementById('gate_login').onclick=()=>FX&&FX.openAuth('login');
if(FX)FX.wireBuyButtons(document);

/* arranque: esperar a que Firebase/Supabase procese el enlace de activación/Google antes de tocar el #hash */
const startHash=location.hash.slice(1);
currentView=(/=/.test(startHash)||!startHash)?'raas':startHash;
setLang(FX?FX.getLang():((navigator.language||'es').slice(0,2)));
if(FX){FX.onAuth((u)=>applyUser(u));FX.getUser().then(u=>{applyUser(u);if(/access_token|type=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search+'#'+currentView);})}
else applyUser(null);
</script>
