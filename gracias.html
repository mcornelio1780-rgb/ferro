<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ferro · Gracias</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">

<script src="assets/config.js"></script>
<script src="assets/ferro.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0F2A4A;color:#EDF1F5;font:17px/1.6 'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background-image:linear-gradient(rgba(237,241,245,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(237,241,245,.06) 1px,transparent 1px);background-size:48px 48px}
.box{max-width:620px;display:grid;gap:18px}
h1{font-stretch:125%;font-weight:900;font-size:clamp(34px,6vw,56px);letter-spacing:-.04em;line-height:1;margin:0}
p{margin:0;color:#C9D3E0}
ol{margin:0;padding-left:20px;color:#C9D3E0}
li{margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;font:600 15px inherit;font-family:inherit;padding:12px 18px;border-radius:3px;border:1.5px solid #EDF1F5;text-decoration:none;color:#0F2A4A;background:#EDF1F5}
.btn.out{background:transparent;color:#EDF1F5;border-color:rgba(237,241,245,.5)}
small{color:#8C96A3}
a{color:#C9D3E0}
</style>
</head>
<body>
<main class="box">
  <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><g fill="#EDF1F5"><polygon points="8,8 50,8 56,20 8,20"/><polygon points="8,26 36,26 42,38 8,38"/><polygon points="8,44 18,44 24,56 8,56" fill="#B4492C"/></g></svg>
  <h1 id="h"></h1>
  <p id="p"></p>
  <ol id="steps"></ol>
  <div class="row"><a class="btn" id="app" href="app.html"></a><a class="btn out" id="portal" href="#" target="_blank" rel="noopener" hidden></a><a class="btn out" id="mail" href="#"></a></div>
  <small id="ref"></small>
</main>
<script>
const T={
es:{h:'¡Gracias por tu compra!',p:'Tu pago se procesó con Polar. Esto es lo que sigue:',app:'Ir a la app',portal:'Mis compras y descargas',mail:'Escribir a Ferro',ref:'Referencia de compra: ',
 kit:['Revisa tu correo: Polar te envió el recibo y el acceso de descarga.','Descarga los 3 modelos y el video desde el enlace o desde tu portal de cliente.','Si no lo ves en 10 minutos, revisa spam o escríbenos con tu referencia de compra.'],
 review:['Envíanos tu memo o modelo respondiendo el correo de Polar o escribiendo a Ferro, con tu referencia de compra.','Empezamos la revisión apenas lo recibimos.','Recibes el reporte en PDF en un máximo de 72 horas hábiles.'],
 pro:['Tu suscripción a Index Pro está activa.','El histórico y los benchmarks llegan a tu correo y quedan en tu portal de cliente.','Puedes cancelar cuando quieras desde el portal.'],
 briefing:['Te escribiremos en menos de 24 horas hábiles para agendar la sesión.','Ten a mano tus preguntas y el tipo de activos que financias.','El reporte se entrega después de la sesión.'],
 def:['Revisa tu correo: Polar te envió el recibo.','Si tienes dudas, escríbenos con tu referencia de compra.']},
en:{h:'Thanks for your purchase!',p:'Your payment was processed by Polar. Here’s what happens next:',app:'Go to the app',portal:'My purchases and downloads',mail:'Email Ferro',ref:'Purchase reference: ',
 kit:['Check your email: Polar sent your receipt and download access.','Download the 3 models and the video from the link or your customer portal.','If you don’t see it within 10 minutes, check spam or email us with your purchase reference.'],
 review:['Send us your memo or model by replying to Polar’s email or emailing Ferro, with your purchase reference.','We start the review as soon as we receive it.','You get the PDF report within 72 business hours.'],
 pro:['Your Index Pro subscription is active.','History and benchmarks arrive by email and stay in your customer portal.','You can cancel anytime from the portal.'],
 briefing:['We’ll email you within 24 business hours to schedule the session.','Have your questions ready and the type of assets you finance.','The report is delivered after the session.'],
 def:['Check your email: Polar sent your receipt.','If you have questions, email us with your purchase reference.']},
pt:{h:'Obrigado pela compra!',p:'Seu pagamento foi processado pela Polar. Veja os próximos passos:',app:'Ir para o app',portal:'Minhas compras e downloads',mail:'Escrever para a Ferro',ref:'Referência da compra: ',
 kit:['Confira seu e-mail: a Polar enviou o recibo e o acesso para download.','Baixe os 3 modelos e o vídeo pelo link ou pelo portal do cliente.','Se não chegar em 10 minutos, verifique o spam ou escreva para nós com a referência da compra.'],
 review:['Envie seu memorando ou modelo respondendo o e-mail da Polar ou escrevendo para a Ferro, com a referência da compra.','Começamos a revisão assim que recebermos.','Você recebe o relatório em PDF em até 72 horas úteis.'],
 pro:['Sua assinatura do Index Pro está ativa.','O histórico e os benchmarks chegam por e-mail e ficam no portal do cliente.','Você pode cancelar quando quiser pelo portal.'],
 briefing:['Escreveremos em até 24 horas úteis para agendar a sessão.','Tenha à mão suas perguntas e o tipo de ativo que você financia.','O relatório é entregue após a sessão.'],
 def:['Confira seu e-mail: a Polar enviou o recibo.','Se tiver dúvidas, escreva para nós com a referência da compra.']},
fr:{h:'Merci pour votre achat !',p:'Votre paiement a été traité par Polar. Voici la suite :',app:'Aller à l’app',portal:'Mes achats et téléchargements',mail:'Écrire à Ferro',ref:'Référence d’achat : ',
 kit:['Consultez vos e-mails : Polar vous a envoyé le reçu et l’accès au téléchargement.','Téléchargez les 3 modèles et la vidéo depuis le lien ou votre portail client.','Rien après 10 minutes ? Vérifiez vos spams ou écrivez-nous avec votre référence d’achat.'],
 review:['Envoyez-nous votre mémo ou modèle en répondant à l’e-mail de Polar ou en écrivant à Ferro, avec votre référence d’achat.','Nous commençons la revue dès réception.','Vous recevez le rapport PDF sous 72 heures ouvrées.'],
 pro:['Votre abonnement Index Pro est actif.','L’historique et les références arrivent par e-mail et restent dans votre portail client.','Vous pouvez résilier à tout moment depuis le portail.'],
 briefing:['Nous vous écrirons sous 24 heures ouvrées pour planifier la séance.','Préparez vos questions et le type d’actifs que vous financez.','Le rapport est livré après la séance.'],
 def:['Consultez vos e-mails : Polar vous a envoyé le reçu.','Une question ? Écrivez-nous avec votre référence d’achat.']}
};
const q=new URLSearchParams(location.search),C=window.FERRO_CONFIG||{};
const l=window.Ferro?Ferro.getLang():'es',d=T[l]||T.es,prod=q.get('p'),cid=q.get('checkout_id')||'';
document.documentElement.lang=l;
document.getElementById('h').textContent=d.h;document.getElementById('p').textContent=d.p;
document.getElementById('steps').innerHTML=(d[prod]||d.def).map(x=>`<li>${x}</li>`).join('');
const app=document.getElementById('app');app.textContent=d.app;app.href='app.html?lang='+l;
const portal=(C.polar||{}).portal,pe=document.getElementById('portal');if(portal){pe.hidden=false;pe.href=portal;pe.textContent=d.portal;}
const mail=C.email||'manyosa@limly.io',me=document.getElementById('mail');me.textContent=d.mail;me.href='mailto:'+mail+'?subject='+encodeURIComponent('Ferro · '+(prod||'order')+' · '+cid);
if(cid)document.getElementById('ref').textContent=d.ref+cid;
</script>
</body>
</html>
