*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.65 var(--f)}
a{color:var(--cyan)}
header{position:sticky;top:0;z-index:5;background:var(--prussian);color:#EDF1F5}

.wrap{max-width:1100px;margin:0 auto;padding:36px 20px 80px;display:grid;grid-template-columns:240px 1fr;gap:40px}
nav.toc{position:sticky;top:90px;align-self:start;display:grid;gap:4px}
nav.toc a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:3px;font-size:15px}
nav.toc a:hover{background:var(--card);color:var(--fg)}
h1{font-stretch:125%;font-weight:800;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.05;margin:0 0 8px}
.meta{color:var(--muted);font-size:14px;margin-bottom:24px}
section{background:var(--card);border:1px solid var(--line);padding:28px;margin-bottom:22px;border-radius:3px}
section h2{font-stretch:115%;font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0 0 14px}
section h3{font-size:17px;margin:20px 0 6px}
section p,section li{max-width:72ch}
section ul{padding-left:20px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--cyan);padding-left:12px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav.toc{position:static;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}

es:{title:'Legal',meta:'Última actualización: {updated} · {company}, {state}',sections:[
['terms','Términos y condiciones',`
<h3>1. Quiénes somos</h3><p>Este sitio y la aplicación Ferro son operados por {company}, sociedad constituida en {state} (“Ferro”). Contacto: <a href="mailto:{email}">{email}</a>.</p>
<h3>2. Qué ofrecemos</h3><p>Contenido educativo, modelos financieros descargables, un índice de precios elaborado con datos públicos, una aplicación web de cálculo y servicios de revisión de documentos.</p>
<h3>3. Ferro no es asesoría ni un prestamista</h3><p>Ferro no presta asesoría de inversión, legal, tributaria ni contable; no ofrece valores ni capta fondos del público; y no es un banco ni un prestamista. Los resultados de los modelos son estimaciones basadas en los supuestos que tú ingresas y no garantizan resultados futuros. Las decisiones financieras son tuyas.</p>
<h3>4. Tu cuenta</h3><p>Debes ser mayor de 18 años, dar datos veraces y cuidar tu contraseña. Podemos suspender cuentas por uso indebido o fraude.</p>
<h3>5. Compras y pagos</h3><p>Los pagos se procesan a través de Polar, que actúa como comerciante registrado (merchant of record): cobra, emite el comprobante y gestiona los impuestos aplicables. Al comprar también aceptas sus condiciones. Los precios están en dólares estadounidenses. Los servicios (Ferro Review y Briefing) se cobran con Stripe o PayPal, que actúan como procesadores de pago.</p>
<h3>6. Licencia de los productos</h3><p>Los modelos y materiales comprados se licencian para uso interno de tu persona o empresa. Puedes usar sus resultados en presentaciones a financistas, pero no revender, redistribuir ni publicar los archivos.</p>
<h3>7. Uso aceptable</h3><p>No está permitido extraer datos de la app de forma automatizada, intentar acceder a cuentas o datos de terceros, ni usar el servicio para fines ilícitos.</p>
<h3>8. Propiedad intelectual</h3><p>La marca Ferro, el logo y los contenidos pertenecen a Ferro. Los datos que tú ingresas siguen siendo tuyos.</p>
<h3>9. Garantías y responsabilidad</h3><p>El servicio se ofrece “tal cual”. En la medida máxima que permita la ley, la responsabilidad de Ferro se limita al monto que pagaste en los 12 meses anteriores al reclamo. Nada en estos términos limita los derechos irrenunciables que te reconozca la ley de protección al consumidor de tu país.</p>

['privacy','Política de privacidad',`
<h3>1. Responsable</h3><p>{company} · {address} · <a href="mailto:{email}">{email}</a>.</p>
<h3>2. Qué datos tratamos</h3><ul><li><b>Cuenta:</b> nombre, correo y contraseña (guardada cifrada por nuestro proveedor de autenticación). Si entras con Google: nombre, correo y foto de perfil.</li><li><b>Perfil:</b> empresa, cargo, país e idioma, si los completas.</li><li><b>Formularios:</b> lo que escribes en contacto y tu correo si te suscribes al índice.</li><li><b>Uso de la app:</b> los escenarios que decides guardar en tu cuenta.</li><li><b>Compras:</b> Polar trata tu nombre, correo, país y datos de pago. Ferro nunca ve tu tarjeta; solo recibe la confirmación del pedido.</li><li><b>Técnicos:</b> preferencia de idioma y sesión, guardadas en tu navegador.</li></ul>
<p>No usamos cookies publicitarias ni rastreadores de terceros.</p>
<h3>3. Para qué los usamos</h3><p>Crear y operar tu cuenta, responder tus consultas, enviarte el índice si te suscribiste, entregar productos y soporte, proteger el servicio contra fraude y cumplir obligaciones legales.</p>

<h3>5. Con quién los compartimos</h3><p>Solo con proveedores que nos prestan servicios: Google Firebase o Supabase (base de datos y autenticación), FormSubmit (envío de los formularios a nuestro correo), Polar, Stripe y PayPal (cobros), nuestro proveedor de hosting, Google (si eliges entrar con Google), Substack (si te suscribes al boletín) y nuestro proveedor de correo transaccional. No vendemos tus datos personales.</p>
<h3>6. Transferencias internacionales</h3><p>Estos proveedores pueden procesar datos en Estados Unidos u otros países. Usamos proveedores con garantías contractuales adecuadas.</p>
<h3>7. Cuánto tiempo los guardamos</h3><p>Mientras tengas cuenta. Los mensajes de contacto, hasta 24 meses. Los datos de compras, el tiempo que exija la ley tributaria. Después se eliminan o anonimizan.</p>

<h3>10. Menores</h3><p>Ferro no está dirigido a menores de 18 años.</p>`],
['ai','Uso de inteligencia artificial y regulación',`
<h3>1. Cómo usamos la IA</h3><p>Ferro usa modelos de lenguaje de terceros (por ejemplo, Claude, de Anthropic) para investigar, redactar y traducir contenido y documentos de trabajo. Una persona revisa todo lo que publicamos.</p>
<h3>2. Lo que la IA no hace en Ferro</h3><ul><li>Los cálculos de la app (DSCR, TIR, VPN, payback y sensibilidad) son fórmulas financieras fijas, no IA.</li><li>El deal memo se arma con plantillas a partir de tus números.</li><li>Ferro no toma decisiones automatizadas con efectos jurídicos o significativos sobre personas, no evalúa la solvencia crediticia de personas naturales y no usa reconocimiento biométrico ni perfilamiento.</li></ul>

<h3>4. Tus datos y la IA</h3><p>No usamos tus datos ni los de tu empresa para entrenar modelos de IA. Cuando trabajamos con proveedores de IA, lo hacemos bajo condiciones comerciales que no permiten entrenar con la información enviada.</p>
<h3>5. Supervisión humana</h3><p>Puedes pedir que una persona revise cualquier resultado o contenido de Ferro escribiendo a <a href="mailto:{email}">{email}</a>.</p>
<h3>6. Marco regulatorio que seguimos</h3><ul>
<li><b>Unión Europea:</b> Reglamento (UE) 2024/1689 de Inteligencia Artificial, en especial sus obligaciones de transparencia. La evaluación de solvencia de personas naturales es de alto riesgo según ese reglamento; Ferro no realiza ese uso. También el artículo 22 del RGPD sobre decisiones automatizadas.</li>
<li><b>Perú:</b> Ley N.° 31814, que promueve el uso de la IA, y su Reglamento (D.S. N.° 115-2025-PCM), vigente desde el 22 de enero de 2026 con implementación gradual por sectores; además, la Ley N.° 29733 de Protección de Datos Personales.</li>
<li><b>Brasil:</b> LGPD (Ley 13.709/2018), artículo 20, sobre la revisión de decisiones automatizadas. Seguimos el proyecto de ley de IA en trámite.</li>
<li><b>Estados Unidos:</b> sección 5 de la Ley de la FTC, que prohíbe afirmaciones engañosas, incluidas las referidas a IA, y las leyes estatales de IA a medida que entran en vigor.</li>
<li><b>Otros países:</b> los Principios de IA de la OCDE y la ley de privacidad de cada país donde operamos.</li></ul>
<h3>7. Revisión</h3><p>Revisamos esta política al menos cada seis meses.</p>
<p class="note">Esta página describe nuestras prácticas y el marco que seguimos. No es asesoría legal.</p>`],
['refunds','Reembolsos y cancelaciones',`
<ul><li><b>Ferro Kit:</b> si no te sirve, escríbenos dentro de los 14 días posteriores a la compra y lo resolvemos, incluido el reembolso.</li><li><b>Ferro Review:</b> reembolso completo si cancelas antes de que empecemos la revisión. Una vez entregado el reporte, no hay reembolso.</li><li><b>Index Pro:</b> cancela cuando quieras desde el portal de cliente de Polar. Mantienes el acceso hasta el final del periodo pagado.</li><li><b>Briefing:</b> según la propuesta acordada.</li></ul>
<p>Los reembolsos se procesan a través de Polar o Stripe, al mismo medio de pago. Si vives en un país con derecho de desistimiento, este también se aplica en lo que corresponda.</p>`],

<p>Solo usamos almacenamiento estrictamente necesario en tu navegador: la sesión de tu cuenta, tu idioma y los escenarios que guardas localmente. No usamos cookies de analítica ni de publicidad.</p>

['privacy','Privacy policy',`

<h3>2. Data we process</h3><ul><li><b>Account:</b> name, email and password (stored encrypted by our authentication provider). If you sign in with Google: name, email and profile picture.</li><li><b>Profile:</b> company, role, country and language, if you provide them.</li><li><b>Forms:</b> what you write in the contact form and your email if you subscribe to the index.</li><li><b>App use:</b> the scenarios you choose to save to your account.</li><li><b>Purchases:</b> Polar processes your name, email, country and payment data. Ferro never sees your card; it only receives order confirmation.</li><li><b>Technical:</b> language preference and session, stored in your browser.</li></ul>

<h3>4. Legal bases</h3><p>Performance of contract (account and purchases), consent (newsletter and forms), legitimate interest (security and professional communications with opt-out) and legal obligation. In Peru, we process data with your consent under Law No. 29733 and its Regulation (Supreme Decree No. 016-2024-JUS).</p>

['ai','AI use and regulation',`

<h3>2. What AI does not do at Ferro</h3><ul><li>The app’s calculations (DSCR, IRR, NPV, payback and sensitivity) are fixed financial formulas, not AI.</li><li>The deal memo is built from templates using your numbers.</li><li>Ferro makes no automated decisions with legal or similarly significant effects on people, does not assess the creditworthiness of individuals and uses no biometric recognition or profiling.</li></ul>

<h3>5. Human oversight</h3><p>You can ask for a person to review any Ferro output or content by emailing <a href="mailto:{email}">{email}</a>.</p>

<li><b>Peru:</b> Law No. 31814 promoting the use of AI and its Regulation (Supreme Decree No. 115-2025-PCM), in force since January 22, 2026 with phased implementation by sector; plus Personal Data Protection Law No. 29733.</li>

<li><b>Other countries:</b> the OECD AI Principles and the privacy law of each country where we operate.</li></ul>
<h3>7. Review</h3><p>We review this policy at least every six months.</p>
<p class="note">This page describes our practices and the framework we follow. It is not legal advice.</p>`],

['privacy','Política de privacidade',`
<h3>1. Controlador</h3><p>{company} · {address} · <a href="mailto:{email}">{email}</a>.</p>
<h3>2. Dados que tratamos</h3><ul><li><b>Conta:</b> nome, e-mail e senha (guardada criptografada pelo provedor de autenticação). Se entrar com Google: nome, e-mail e foto de perfil.</li><li><b>Perfil:</b> empresa, cargo, país e idioma, se você informar.</li><li><b>Formulários:</b> o que você escreve no contato e seu e-mail se assinar o índice.</li><li><b>Uso do app:</b> os cenários que você decide salvar na sua conta.</li><li><b>Compras:</b> a Polar trata seu nome, e-mail, país e dados de pagamento. A Ferro nunca vê seu cartão; recebe apenas a confirmação do pedido.</li><li><b>Técnicos:</b> preferência de idioma e sessão, guardadas no seu navegador.</li></ul>
<p>Não usamos cookies de publicidade nem rastreadores de terceiros.</p>
<h3>3. Para que usamos</h3><p>Criar e operar sua conta, responder suas consultas, enviar o índice se você assinou, entregar produtos e suporte, proteger o serviço contra fraude e cumprir obrigações legais.</p>
<h3>4. Bases legais</h3><p>Execução de contrato (conta e compras), consentimento (newsletter e formulários), legítimo interesse (segurança e comunicações profissionais com opção de descadastro) e obrigação legal, conforme a LGPD.</p>
<h3>5. Com quem compartilhamos</h3><p>Somente com prestadores de serviço: Google Firebase ou Supabase (banco de dados e autenticação), FormSubmit (envio dos formulários para nosso e-mail), Polar, Stripe e PayPal (pagamentos), nosso provedor de hospedagem, Google (se entrar com Google), Substack (se assinar a newsletter) e nosso provedor de e-mail transacional. Não vendemos dados pessoais.</p>
<h3>6. Transferências internacionais</h3><p>Esses prestadores podem tratar dados nos Estados Unidos ou em outros países. Usamos prestadores com garantias contratuais adequadas.</p>
<h3>7. Por quanto tempo guardamos</h3><p>Enquanto você tiver conta. Mensagens de contato, até 24 meses. Dados de compras, pelo prazo exigido pela lei tributária. Depois, são excluídos ou anonimizados.</p>
<h3>8. Seus direitos</h3><p>Você pode pedir confirmação, acesso, correção, exclusão, portabilidade, informação sobre compartilhamento, oposição ou revogar o consentimento (art. 18 da LGPD). Escreva para <a href="mailto:{email}">{email}</a>; respondemos dentro do prazo legal. Você também pode reclamar à ANPD.</p>
<h3>9. Segurança</h3><p>Conexões criptografadas (HTTPS), controle de acesso por usuário no banco de dados e senhas gerenciadas pelo provedor de autenticação.</p>
<h3>10. Menores</h3><p>A Ferro não é direcionada a menores de 18 anos.</p>`],
['ai','Uso de inteligência artificial e regulação',`
<h3>1. Como usamos IA</h3><p>A Ferro usa modelos de linguagem de terceiros (por exemplo, Claude, da Anthropic) para pesquisar, redigir e traduzir conteúdos e documentos de trabalho. Uma pessoa revisa tudo o que publicamos.</p>
<h3>2. O que a IA não faz na Ferro</h3><ul><li>Os cálculos do app (DSCR, TIR, VPL, payback e sensibilidade) são fórmulas financeiras fixas, não IA.</li><li>O memorando é montado com modelos a partir dos seus números.</li><li>A Ferro não toma decisões automatizadas com efeitos jurídicos ou significativos sobre pessoas, não avalia a capacidade de crédito de pessoas físicas e não usa reconhecimento biométrico nem perfilamento.</li></ul>
<h3>3. Transparência</h3><p>Identificamos conteúdo gerado ou assistido por IA quando cabível. Se incorporarmos funções de IA no app, informaremos na interface antes do uso.</p>
<h3>4. Seus dados e a IA</h3><p>Não usamos seus dados nem os da sua empresa para treinar modelos de IA. Quando trabalhamos com provedores de IA, fazemos isso em condições comerciais que não permitem treinar com as informações enviadas.</p>
<h3>5. Supervisão humana</h3><p>Você pode pedir que uma pessoa revise qualquer resultado ou conteúdo da Ferro escrevendo para <a href="mailto:{email}">{email}</a> (art. 20 da LGPD).</p>
<h3>6. Marco regulatório que seguimos</h3><ul>
<li><b>Brasil:</b> LGPD (Lei 13.709/2018), art. 20, sobre revisão de decisões automatizadas. Acompanhamos o projeto de lei de IA em tramitação.</li>
<li><b>União Europeia:</b> Regulamento (UE) 2024/1689 sobre IA, em especial as obrigações de transparência. A avaliação de crédito de pessoas físicas é de alto risco nesse regulamento; a Ferro não faz esse uso. Também o art. 22 do RGPD.</li>
<li><b>Peru:</b> Lei n.º 31814 e seu Regulamento (Decreto Supremo n.º 115-2025-PCM), vigente desde 22 de janeiro de 2026 com implementação gradual por setores; e a Lei n.º 29733 de proteção de dados.</li>
<li><b>Estados Unidos:</b> seção 5 da Lei da FTC, que proíbe alegações enganosas, inclusive sobre IA, e as leis estaduais de IA à medida que entram em vigor.</li>
<li><b>Outros países:</b> os Princípios de IA da OCDE e a lei de privacidade de cada país onde atuamos.</li></ul>
<h3>7. Revisão</h3><p>Revisamos esta política pelo menos a cada seis meses.</p>
<p class="note">Esta página descreve nossas práticas e o marco que seguimos. Não é consultoria jurídica.</p>`],
['refunds','Reembolsos e cancelamentos',`

<p>Os reembolsos são processados pela Polar no mesmo meio de pagamento. O direito de arrependimento do CDC se aplica quando cabível.</p>`],

fr:{title:'Mentions légales',meta:'Dernière mise à jour : {updated} · {company}, {state}',sections:[
['terms','Conditions d’utilisation',`

<h3>3. Ferro n’est ni un conseil ni un prêteur</h3><p>Ferro ne fournit aucun conseil en investissement, juridique, fiscal ou comptable ; n’offre pas de titres et ne collecte pas de fonds auprès du public ; et n’est ni une banque ni un prêteur. Les résultats des modèles sont des estimations fondées sur vos hypothèses et ne garantissent aucun résultat futur. Les décisions financières vous appartiennent.</p>
<h3>4. Votre compte</h3><p>Vous devez avoir au moins 18 ans, fournir des informations exactes et protéger votre mot de passe. Nous pouvons suspendre un compte en cas d’abus ou de fraude.</p>
<h3>5. Achats et paiements</h3><p>Les paiements sont traités par Polar, qui agit comme marchand officiel (merchant of record) : il encaisse, émet le reçu et gère les taxes applicables. En achetant, vous acceptez aussi ses conditions. Les prix sont en dollars américains. Les services (Ferro Review et Briefing) sont facturés via Stripe ou PayPal, en tant que prestataires de paiement.</p>
<h3>6. Licence des produits</h3><p>Les modèles et documents achetés sont concédés pour un usage interne, personnel ou par votre entreprise. Vous pouvez utiliser leurs résultats dans des présentations à des prêteurs, mais vous ne pouvez pas revendre, redistribuer ni publier les fichiers.</p>
<h3>7. Usage acceptable</h3><p>L’extraction automatisée de données de l’app, toute tentative d’accès aux comptes ou données de tiers et tout usage illicite sont interdits.</p>
<h3>8. Propriété intellectuelle</h3><p>La marque Ferro, le logo et les contenus appartiennent à Ferro. Les données que vous saisissez restent les vôtres.</p>
<h3>9. Garanties et responsabilité</h3><p>Le service est fourni « en l’état ». Dans la mesure maximale permise par la loi, la responsabilité de Ferro est limitée au montant que vous avez payé au cours des 12 mois précédant la réclamation. Rien dans ces conditions ne limite vos droits impératifs de consommateur.</p>

['ai','Usage de l’intelligence artificielle et réglementation',`

<h3>5. Contrôle humain</h3><p>Vous pouvez demander qu’une personne revoie tout résultat ou contenu de Ferro en écrivant à <a href="mailto:{email}">{email}</a>.</p>

const C=window.FERRO_CONFIG||{};const LG=C.legal||{};
function fill(s){return s.replace(/\{company\}/g,LG.company||'Ferro').replace(/\{state\}/g,LG.state||'').replace(/\{address\}/g,LG.address||'—').replace(/\{email\}/g,C.email||'manyosa@limly.io').replace(/\{updated\}/g,LG.updated||'')}
function render(l){
  const d=L10N[l]||L10N.es;
  if(window.Ferro)Ferro.setLang(l);document.documentElement.lang=l;
  document.title='Ferro · '+d.title;
  document.getElementById('title').textContent=d.title;
  document.getElementById('meta').textContent=fill(d.meta);
  document.getElementById('toc').innerHTML=d.sections.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('');
  document.getElementById('content').innerHTML=d.sections.map(s=>`<section id="${s[0]}"><h2>${s[1]}</h2>${fill(s[2])}</section>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  document.getElementById('home').href='index.html?lang='+l;
  if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.lang)));
render(window.Ferro?Ferro.getLang():'es');
</script>
