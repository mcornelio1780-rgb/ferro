<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferro · Financiamos el hierro de la IA</title>
<meta name="description" content="Modelos financieros, índice de precios de GPU y revisión de deals para robots, GPUs y data centers.">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Ferro · Financing the iron behind AI">
<meta property="og:description" content="Financial models, a GPU price index and deal reviews for robots, GPUs and data centers.">
<meta property="og:image" content="assets/icon-512.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230F2A4A'/%3E%3Cg fill='%23EDF1F5'%3E%3Cpolygon points='12,13 44,13 49,24 12,24'/%3E%3Cpolygon points='12,28 34,28 39,39 12,39'/%3E%3Cpolygon points='12,43 21,43 26,54 12,54'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --prussian:#0F2A4A;--cyan:#1F4FA3;--paper:#EDF1F5;--oxide:#B4492C;--steel:#8C96A3;--ink:#0A1626;--signal:#1E8F5A;
  --bg:var(--paper);--fg:var(--ink);--muted:#3B4A5E;--card:#FFFFFF;--line:rgba(15,42,74,.14);
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--fg:#E6ECF3;--muted:#A9B6C6;--card:#11243D;--line:rgba(237,241,245,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A2E;--fg:#E6ECF3;--muted:#A9B6C6;--card:#11243D;--line:rgba(237,241,245,.12);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--oxide);outline-offset:3px}
.container{width:min(1200px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-stretch:125%;letter-spacing:-.03em;line-height:1;margin:0}
h2{font-size:clamp(34px,5.4vw,68px);font-weight:800;max-width:18ch}
h3{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
p{margin:0 0 14px;max-width:62ch}
.lead{font-size:clamp(18px,1.6vw,21px);line-height:1.5;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--f);padding:14px 22px;border-radius:3px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.buy{background:var(--oxide);color:#fff}
.btn.solid{background:var(--cyan);color:#fff}
.btn.line{border-color:currentColor;background:transparent}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--prussian)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--prussian);color:var(--paper)}
header .container{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--paper)}
.logo b{font-stretch:125%;font-weight:900;font-size:24px;letter-spacing:-.04em}
nav.main{display:flex;gap:22px;font-size:15px}
nav.main a{text-decoration:none;color:#C9D3E0}
nav.main a:hover{color:#fff}
.hdr-right{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid rgba(237,241,245,.25);border-radius:3px;overflow:hidden}
.lang button{font:600 13px var(--f);background:transparent;color:#C9D3E0;border:0;padding:7px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--prussian)}
.hdr-right .btn{padding:9px 14px;font-size:14px}
.hdr-login{border-color:rgba(237,241,245,.4)!important}
[hidden]{display:none!important}
.hdr-right .btn{white-space:nowrap}
@media (max-width:1180px){nav.main{display:none}nav.main.open{display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:var(--prussian);padding:18px 20px;gap:14px}.menu-btn{display:inline-block}}
.nav-mobile{display:none}
@media (max-width:620px){nav.main.open .nav-mobile:not([hidden]){display:block;color:#fff!important;font-weight:700}}
.menu-btn{display:none;background:none;border:0;color:var(--paper);font:600 15px var(--f);cursor:pointer}

/* hero */
.hero{background:var(--prussian);color:var(--paper);position:relative;overflow:hidden;padding:clamp(56px,9vw,120px) 0 0}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(237,241,245,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(237,241,245,.06) 1px,transparent 1px);background-size:56px 56px;pointer-events:none}
.hero .container{position:relative}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,56px);align-items:end}
.hero-mark{width:clamp(80px,14vw,190px)}
.hero-mark polygon{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.hero-mark polygon:nth-child(2){animation-delay:.12s}.hero-mark polygon:nth-child(3){animation-delay:.24s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero h1{font-size:clamp(44px,8.6vw,124px);font-weight:900;letter-spacing:-.045em;line-height:.92;max-width:12ch}
.hero .sub{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;margin-top:44px;align-items:end}
.hero .sub p{color:#C9D3E0;font-size:clamp(18px,1.6vw,21px);margin:0}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.hero .ctas .line{color:var(--paper)}
.ticker{margin-top:clamp(48px,7vw,88px);border-top:1px solid rgba(237,241,245,.16);overflow:hidden;white-space:nowrap;position:relative}
.ticker-track{display:inline-flex;animation:tick 48s linear infinite;padding:18px 0}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:baseline;gap:10px;padding:0 28px;border-right:1px solid rgba(237,241,245,.12);font-variant-numeric:tabular-nums}
.tk .n{color:#C9D3E0;font-size:14px}
.tk .v{font-stretch:115%;font-weight:700;font-size:20px;color:#fff}
.tk .d{font-size:13px;font-weight:600}
.up{color:#4FC48F}.dn{color:#E8836A}
.ticker-note{font-size:12.5px;color:var(--steel);padding:0 0 16px}

/* sections */
section{padding:clamp(72px,10vw,128px) 0;border-bottom:1px solid var(--line)}
.chapter{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:15px;margin-bottom:22px}
.chapter i{display:inline-block;width:28px;height:2px;background:var(--cyan)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,96px);align-items:start}
.pains{display:grid;gap:0;border-top:1px solid var(--line);margin-top:8px}
.pain{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.pain svg{width:36px;height:36px;color:var(--cyan)}
.pain h3{margin-bottom:6px}
.pain p{margin:0;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:48px;border-top:2px solid var(--prussian)}
.stat{padding:24px 24px 24px 0;border-bottom:1px solid var(--line)}
.stat .n{font-stretch:115%;font-weight:900;font-size:clamp(28px,3vw,40px);letter-spacing:-.04em;line-height:1;color:var(--cyan);font-variant-numeric:tabular-nums}
.stat.key .n{color:var(--oxide)}
.stat p{margin:10px 0 6px;font-size:15.5px}
.stat a{font-size:12.5px;color:var(--muted)}
.solve{margin-top:40px;padding:28px;background:var(--prussian);color:var(--paper);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.solve b{font-stretch:125%;font-weight:800;font-size:clamp(20px,2.4vw,30px);letter-spacing:-.02em;line-height:1.15;display:block}
.solve p{margin:8px 0 0;color:#C9D3E0}
@media (max-width:980px){.stats{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.stats{grid-template-columns:1fr}.solve{grid-template-columns:1fr}}

/* compare */
.compare{display:grid;grid-template-columns:1fr 1fr;margin-top:40px;border:1px solid var(--line);background:var(--card)}
.compare > div{padding:28px}
.compare > div + div{border-left:1px solid var(--line)}
.compare dt{font-size:14px;color:var(--muted);margin-top:14px}
.compare dd{margin:2px 0 0;font-stretch:112%;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.compare .bad dd{color:var(--oxide)}
.compare .good dd{color:var(--cyan)}

/* history timeline (real sequence) */
.history{background:var(--prussian);color:var(--paper)}
.history .lead{color:#C9D3E0}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:48px;border-top:2px solid rgba(237,241,245,.25)}
.era{padding:22px 22px 0 0;position:relative}
.era::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;background:var(--paper)}
.era.now::before{background:var(--oxide)}
.era .y{font-stretch:125%;font-weight:900;font-size:clamp(30px,3.6vw,46px);letter-spacing:-.03em}
.era h3{margin:8px 0 6px;font-size:19px}
.era p{color:#C9D3E0;font-size:15.5px}

/* products */
.products{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:20px;margin-top:44px}
.prod{background:var(--card);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:12px}
.prod.feature{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.prod.feature p,.prod.feature li{color:#E3EBF7}
.prod .price{font-stretch:125%;font-weight:900;font-size:40px;letter-spacing:-.03em}
.prod .price small{font-size:15px;font-weight:500;font-stretch:100%;letter-spacing:0}
.prod ul{margin:0;padding-left:18px;color:var(--muted);font-size:15.5px}
.prod li{margin:4px 0}
.prod .btn{margin-top:auto;align-self:flex-start}
.prod.feature .btn.buy{background:#fff;color:var(--oxide)}

/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;margin-top:40px;border:1px solid var(--line);background:var(--card)}
.calc form{padding:28px;display:grid;gap:18px}
.field label{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:8px}
.field output{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
input[type=range]{width:100%;accent-color:var(--cyan)}
.calc .out{background:var(--prussian);color:var(--paper);padding:28px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.calc .big{font-stretch:125%;font-weight:900;font-size:clamp(48px,6vw,76px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.calc .row{display:flex;justify-content:space-between;border-top:1px solid rgba(237,241,245,.14);padding-top:10px;font-variant-numeric:tabular-nums}
.calc .row span{color:#C9D3E0}
.calc .note{font-size:13px;color:var(--steel)}
.calc .out a{color:#fff}

/* ICP */
.icps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:40px}
.icp{border-top:3px solid var(--prussian);padding-top:18px}
.icp h3{font-size:19px;margin-bottom:8px}
.icp p{color:var(--muted);font-size:15.5px}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:40px}
.plan{background:var(--card);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:10px}
.plan.hl{border:2px solid var(--oxide)}
.plan .p{font-stretch:125%;font-weight:900;font-size:36px;letter-spacing:-.03em}
.plan .p small{font-size:14px;font-weight:500;font-stretch:100%;letter-spacing:0;color:var(--muted)}
.plan p{font-size:15px;color:var(--muted);margin:0}
.plan .btn{margin-top:auto;padding:12px 16px;font-size:15px}
.paynote{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:14px;color:var(--muted)}

/* lead form */
.signup{background:var(--cyan);color:#fff}
.signup .lead{color:#DCE6F5}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-top:28px}
.form input,.form select{font:16px var(--f);padding:14px;border-radius:3px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;min-width:0}
.form select option{color:#0A1626}
.form input::placeholder{color:#C8D6EE}
.form .btn{background:#fff;color:var(--prussian)}
.formmsg{margin-top:12px;font-size:15px;min-height:22px}
.consent{font-size:13px;color:#C8D6EE;margin-top:6px}

/* contact */
.cform{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);padding:24px}
.cform label{display:grid;gap:6px;font-size:14px;font-weight:600}
.cform input,.cform select,.cform textarea{font:16px var(--f);padding:12px;border:1.5px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.cform textarea{resize:vertical}
.cform .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cform .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13.5px;color:var(--muted)}
.cform .chk input{width:16px;height:16px;margin-top:2px;flex:none}
.cform .chk a{color:var(--cyan)}
.cform .btn{justify-self:start}
.formmsg2{font-size:15px;min-height:22px}
.formmsg2.ok{color:var(--signal)}.formmsg2.err{color:var(--oxide)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@media (max-width:620px){.cform .row2{grid-template-columns:1fr}}

/* faq */
.faq{margin-top:32px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:22px 40px 22px 0;font-stretch:110%;font-weight:700;font-size:19px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:18px;font-size:26px;font-weight:400;color:var(--cyan);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:20px}

/* footer */
footer{background:var(--ink);color:#A9B6C6;padding:56px 0 40px;font-size:14px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
footer a{color:#C9D3E0;text-decoration:none;display:block;margin:4px 0}
footer .disc{border-top:1px solid rgba(237,241,245,.1);margin-top:36px;padding-top:20px;font-size:13px}

@media (max-width:980px){
  nav.main{display:none}
  nav.main.open{display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:var(--prussian);padding:18px 20px;gap:14px}
  .menu-btn{display:inline-block}
  .hero .sub,.split,.calc{grid-template-columns:1fr}
  .hero .ctas{justify-content:flex-start}
  .products{grid-template-columns:1fr}
  .timeline,.icps,.plans{grid-template-columns:1fr 1fr;row-gap:32px}
  .form{grid-template-columns:1fr 1fr}
  .form input[type=email]{grid-column:1/-1}
  footer .cols{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .hdr-right .btn{display:none}
  .hero-grid{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr}.compare > div + div{border-left:0;border-top:1px solid var(--line)}
  .timeline,.icps,.plans,.form{grid-template-columns:1fr}
  footer .cols{grid-template-columns:1fr}
}
</style>

<script src="assets/config.js"></script>
<script src="assets/ferro.js"></script>
</head>
<body>
<header>
  <div class="container">
    <a class="logo" href="#top" aria-label="Ferro">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><g fill="#EDF1F5"><polygon points="8,8 50,8 56,20 8,20"/><polygon points="8,26 36,26 42,38 8,38"/><polygon points="8,44 18,44 24,56 8,56"/></g></svg>
      <b>ferro</b>
    </a>
    <nav class="main" id="mainnav">
      <a href="#problema" data-i="nav_problem"></a>
      <a href="#producto" data-i="nav_product"></a>
      <a href="#calculadora" data-i="nav_calc"></a>
      <a href="#precios" data-i="nav_pricing"></a>
      <a href="#faq" data-i="nav_faq"></a>
      <a href="#contacto" data-i="ct_ch"></a>
      <a href="#" class="nav-mobile" id="nav_login" data-i="login"></a>
      <a href="app.html" class="nav-mobile" id="nav_app" data-app-link data-i="open_app" hidden></a>
    </nav>
    <div class="hdr-right">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="pt">PT</button><button data-lang="fr">FR</button>
      </div>
      <button class="btn line hdr-login" type="button" id="hdr_login" data-i="login" style="color:var(--paper)"></button>
      <a class="btn solid hdr-app" id="hdr_app" href="app.html" data-i="open_app" hidden></a>
      <a class="btn buy" data-buy="kit" data-medium="header" href="#precios" data-i="nav_cta"></a>
      <button class="menu-btn" aria-controls="mainnav" aria-expanded="false" data-i="menu"></button>
    </div>
  </div>
</header>

<main id="top">
<section class="hero" aria-labelledby="h1">
  <div class="container">
    <div class="hero-grid">
      <svg class="hero-mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="#EDF1F5"><polygon points="8,8 50,8 56,20 8,20"/><polygon points="8,26 36,26 42,38 8,38"/><polygon points="8,44 18,44 24,56 8,56" fill="#B4492C"/></g></svg>
      <h1 id="h1" data-i="hero_h"></h1>
    </div>
    <div class="sub">
      <p data-i="hero_p"></p>
      <div class="ctas">
        <a class="btn buy" data-buy="kit" href="#precios" data-i="cta_kit"></a>
        <a class="btn line" href="app.html" data-app-link data-i="try_app"></a>
      </div>
    </div>
  </div>
  <div class="ticker" aria-label="Índice ilustrativo">
    <div class="ticker-track" id="ticker"></div>
  </div>
  <div class="container ticker-note" data-i="ticker_note"></div>
</section>

<section id="problema">
  <div class="container">
    <div class="chapter"><i></i><span data-i="ch1"></span></div>
    <div class="split">
      <div>
        <h2 data-i="prob_h"></h2>
      </div>
      <div>
        <p class="lead" data-i="prob_p"></p>
        <div class="pains">
          <div class="pain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="7" width="16" height="12"/><path d="M9 7V4h6v3M8 12h2M14 12h2M9 16h6"/></svg><div><h3 data-i="p1h"></h3><p data-i="p1p"></p></div></div>
          <div class="pain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg><div><h3 data-i="p2h"></h3><p data-i="p2p"></p></div></div>
          <div class="pain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h7v7H4zM13 11h7v7h-7z"/><path d="M11 9h3M10 15h3"/></svg><div><h3 data-i="p3h"></h3><p data-i="p3p"></p></div></div>
        </div>
      </div>
    </div>

faq:[['Do I need an account to use the app?','Accounts are free. Sign in with Google or with your email: we send you a link to activate the account. That lets us save your scenarios and notify you about the index.'],['Where is my data stored?','In Ferro’s database hosted on Supabase, with encrypted connections and restricted access. Payments are processed by Polar; Ferro never sees your card. Details in the Privacy policy.'],['Is this investment advice?','No. Ferro publishes educational content, models and public data. We don’t recommend investments or offer securities.'],
['What format is the kit?','You get an instant link to the Excel and Google Sheets files and the video as soon as payment clears.'],
['Does it work outside the US?','Yes. Models are in dollars with configurable currency and rates, and material is available in English, Spanish, Portuguese and French.'],
['Where do index prices come from?','From prices providers publish on their own pages. Every data point has a source and date.'],
['Does Ferro lend money?','Not yet. Today we deliver data, models and reviews. Connecting with lenders comes later, with the right legal structure.'],
['What if the kit doesn’t work for me?','Email us within 14 days of purchase and we’ll sort it out.']],

const COUNTRIES={es:['Estados Unidos','México','Brasil','España','Francia','Canadá','Reino Unido','Alemania','Chile','Colombia','Perú','Argentina','Portugal','Otro'],
en:['United States','Mexico','Brazil','Spain','France','Canada','United Kingdom','Germany','Chile','Colombia','Peru','Argentina','Portugal','Other'],
pt:['Estados Unidos','México','Brasil','Espanha','França','Canadá','Reino Unido','Alemanha','Chile','Colômbia','Peru','Argentina','Portugal','Outro'],
fr:['États-Unis','Mexique','Brésil','Espagne','France','Canada','Royaume-Uni','Allemagne','Chili','Colombie','Pérou','Argentine','Portugal','Autre']};

let L='es';
const fmt=(n,l)=>new Intl.NumberFormat({es:'es-ES',en:'en-US',pt:'pt-BR',fr:'fr-FR'}[l],{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);

function setLang(l){
  if(!T[l])l='es';L=l;document.documentElement.lang=l;
  if(window.Ferro)Ferro.setLang(l);else{try{localStorage.setItem('ferro_lang',l)}catch(e){}}
  const tp=document.getElementById('ct_topic');if(tp){const cur=tp.value;tp.innerHTML=T[l].topics.map((x,i)=>`<option value="${T.en.topics[i]}">${x}</option>`).join('');if(cur)tp.value=cur;}
  const legal=(h)=>window.Ferro?Ferro.legalUrl(h):'legal.html#'+h;
  document.querySelectorAll('[data-legal]').forEach(a=>a.href=legal(a.dataset.legal));
  const cc=document.getElementById('ct_consent');if(cc)cc.innerHTML=T[l].ct_consent.replace('{p}',`<a href="${legal('privacy')}" target="_blank" rel="noopener">${T[l].pp}</a>`);
  document.querySelectorAll('[data-app-link]').forEach(a=>a.href='app.html?lang='+l);
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[l][el.dataset.i];if(typeof v==='string')el.textContent=v;});
  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=T[l][el.dataset.ph]);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  const c=document.getElementById('f_country'),r=document.getElementById('f_role');
  c.innerHTML=`<option value="">${T[l].f_country}</option>`+COUNTRIES[l].map((x,i)=>`<option value="${COUNTRIES.en[i]}">${x}</option>`).join('');
  r.innerHTML=`<option value="">${T[l].f_role}</option>`+T[l].roles.map((x,i)=>`<option value="${T.en.roles[i]}">${x}</option>`).join('');
  document.getElementById('faqlist').innerHTML=T[l].faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
  document.title='Ferro · '+T[l].hero_h;
  calc();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* buy links */
if(window.Ferro)Ferro.wireBuyButtons(document);

/* ticker (illustrative) */
const TK=[['H100 SXM','$2.19/h','−1.8%',0],['H200','$3.05/h','+0.6%',1],['A100 80GB','$1.12/h','−0.9%',0],['L40S','$0.86/h','+1.2%',1],['B200','$4.90/h','+2.1%',1],['RTX 4090','$0.34/h','−0.4%',0],['AMR robot','$2,400/mo','+0.0%',1],['Robot arm 6-axis','$1,850/mo','+0.8%',1],['Colocation','$165/kW·mo','+1.5%',1],['Data center MW','$9.8M/MW','+0.4%',1]];
const row=TK.map(t=>`<span class="tk"><span class="n">${t[0]}</span><span class="v">${t[1]}</span><span class="d ${t[3]?'up':'dn'}">${t[2]}</span></span>`).join('');
document.getElementById('ticker').innerHTML=row+row;

/* calculator */
const $=id=>document.getElementById(id);
function calc(){
  const p=+$('c_price').value,f=+$('c_fee').value,u=+$('c_util').value/100,o=+$('c_opex').value;
  $('o_price').textContent=fmt(p,L);$('o_fee').textContent=fmt(f,L);$('o_util').textContent=Math.round(u*100)+'%';$('o_opex').textContent=fmt(o,L);
  const net=f*u-o;
  $('r_net').textContent=fmt(net,L);
  $('r_36').textContent=fmt(net*36,L);
  $('r_payback').textContent=net>0?(p/net).toFixed(1)+' '+T[L].months:T[L].never;
  const be=(p/36+o)/f;$('r_be').textContent=be>1?'>100%':Math.ceil(be*100)+'%';
}
['c_price','c_fee','c_util','c_opex'].forEach(id=>$(id).addEventListener('input',calc));

/* lead form → Substack */
$('leadform').addEventListener('submit',e=>{
  e.preventDefault();const em=$('f_email').value.trim();const msg=$('formmsg');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){msg.textContent=T[L].bad;$('f_email').focus();return;}
  const btn=e.target.querySelector('button');btn.disabled=true;
  (window.Ferro?Ferro.subscribe({email:em,country:$('f_country').value,role:$('f_role').value,source:'landing'}):Promise.resolve({ok:true})).then(r=>{
    btn.disabled=false;
    if(CONFIG.substack)window.open(CONFIG.substack.replace(/\/$/,'')+'/subscribe?email='+encodeURIComponent(em),'_blank','noopener');
    msg.textContent=T[L].ok;e.target.reset();
  });
});

/* mobile menu */
const mb=document.querySelector('.menu-btn'),nv=$('mainnav');
mb.addEventListener('click',()=>{const o=nv.classList.toggle('open');mb.setAttribute('aria-expanded',o)});
nv.addEventListener('click',e=>{if(e.target.tagName==='A'){nv.classList.remove('open');mb.setAttribute('aria-expanded',false)}});

/* initial language: ?lang= → saved → browser */
setLang(window.Ferro?Ferro.getLang():'es');
const MAIL=CONFIG.email||'manyosa@limly.io';
['mailto','mailto2'].forEach(id=>{const a=$(id);if(a){a.href='mailto:'+MAIL;a.textContent=MAIL;}});
if(CONFIG.legal&&CONFIG.legal.company)$('legal_line').textContent='· '+CONFIG.legal.company+(CONFIG.legal.state?' · '+CONFIG.legal.state:'');

/* contact form → base de datos + aviso por correo */
$('contactform').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f),m=$('ctmsg');
  if(fd.get('website'))return;
  const email=String(fd.get('email')||'').trim(),message=String(fd.get('message')||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)||message.length<5||!fd.get('consent')){m.className='formmsg2 err';m.textContent=T[L].ct_need;return;}
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  const data={name:fd.get('name'),email,company:fd.get('company'),topic:fd.get('topic'),message};
  (window.Ferro?Ferro.contact(data):Promise.resolve({ok:false})).then(r=>{
    btn.disabled=false;
    if(r.ok){m.className='formmsg2 ok';m.textContent=T[L].ct_ok.replace('{e}',email);f.reset();}
    else{m.className='formmsg2 err';m.innerHTML=T[L].ct_err.replace('{m}',`<a href="mailto:${MAIL}?subject=${encodeURIComponent('Ferro · '+(data.topic||''))}&body=${encodeURIComponent(message)}">${MAIL}</a>`);}
  });
});

/* auth state in header */
const goApp=e=>{if(window.Ferro&&Ferro.configured&&!Ferro.user()){e.preventDefault();Ferro.openAuth('signup');}};
document.querySelectorAll('[data-app-link]').forEach(a=>a.addEventListener('click',goApp));
$('hdr_login').addEventListener('click',()=>{if(window.Ferro)Ferro.openAuth('login');});
function paintAuth(u){const on=!!(window.Ferro&&Ferro.configured);$('hdr_login').hidden=!on||!!u;$('hdr_app').hidden=on&&!u;$('hdr_app').href='app.html?lang='+L;$('nav_login').hidden=!on||!!u;$('nav_app').hidden=on&&!u;}
$('nav_login').addEventListener('click',e=>{e.preventDefault();if(window.Ferro)Ferro.openAuth('login');});
paintAuth(null);
if(window.Ferro){Ferro.onAuth(u=>paintAuth(u));Ferro.getUser().then(paintAuth);window.addEventListener('ferro:lang',()=>paintAuth(Ferro.user()));}
</script>
